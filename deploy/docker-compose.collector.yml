# The collector as its own compose project, next to coin_keeper -- not an
# edit to coin_keeper's docker-compose.yml, which stays untouched.
#
# The only thing borrowed from that stack is its network, joined here as
# an external one. On it postgres is reachable as the host `postgres`, so
# the container-IP lookup the host wrapper used to do is gone rather than
# automated.
#
#   docker compose --env-file ~/coinkeeper/.env \
#     -f deploy/docker-compose.collector.yml run --rm update-prices
#
# --env-file points at coin_keeper's OWN .env. That is deliberate: the
# database password then exists in exactly one place on the server, is
# never copied into this repository or a second dotenv, and reaches the
# container as PGPASSWORD -- so it stays out of the connection string,
# out of logs and out of `ps`. DATABASE_URL names only the database.
name: coin-parser

x-collector: &collector
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      UID: "${COLLECTOR_UID:-1000}"
  image: coin-parser:latest
  environment:
    DATABASE_URL: "postgresql:///${POSTGRES_DB:-coinkeeper}"
    PGHOST: "${PGHOST:-postgres}"
    PGPORT: "${PGPORT:-5432}"
    PGUSER: "${POSTGRES_USER:-coinkeeper}"
    PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing -- pass --env-file ~/coinkeeper/.env}"
  volumes:
    # The checkout's own staging/, so the night's kept HTML can be read
    # with ls instead of docker. Created by the wrapper before the run:
    # left to docker, a missing bind-mount source is created as root and
    # the container's own user cannot write into it.
    - ../staging:/staging
  networks: [coinkeeper]
  restart: "no"

services:
  update-prices:
    <<: *collector
    command: ["ua", "--step", "update-prices"]

  # Any other step, one-shot:
  #   docker compose ... run --rm collector ua --step load-prices
  collector:
    <<: *collector

networks:
  coinkeeper:
    external: true
    name: "${COINKEEPER_NETWORK:-coinkeeper_default}"
