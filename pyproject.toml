[project]
name = "coin-collector"
version = "0.1.0"
requires-python = ">=3.12"
# Everything the collecting, matching and database steps need, and
# nothing more. The image deployed on the server installs exactly this
# and stops -- see deploy/Dockerfile.
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# The photo pipeline (fetch-photos/process-photos, and so --step all).
# Split out because it is ~100 MB of wheels that only ever run on a
# workstation: the nightly update-prices on the server has no business
# building an image-processing stack to scrape one HTML table. Locally,
# install with:  pip install -e ".[photos,dev]"
photos = [
    "Pillow>=10.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["collector*"]

# The adapter's dictionaries live next to its code and are part of the
# package, not incidental files in the checkout: series.json is the
# series dictionary every fetch resolves a name against, db_map.json the
# series -> coin_keeper id map load-cards needs. Without this they are
# simply absent from a non-editable install, and the failure is
# invisible until something asks for them -- an install run from the
# source tree keeps working, because then the source tree is what gets
# imported.
[tool.setuptools.package-data]
collector = ["countries/*/*.json"]
